services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DJANGO_DB_NAME:-app}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DJANGO_DB_USER: ${DJANGO_DB_USER:-app_write}
      DJANGO_DB_PASSWORD: ${DJANGO_DB_PASSWORD:?Set DJANGO_DB_PASSWORD in .env}
      DJANGO_DB_READONLY_USER: ${DJANGO_DB_READONLY_USER:-app_readonly}
      DJANGO_DB_READONLY_PASSWORD: ${DJANGO_DB_READONLY_PASSWORD:?Set DJANGO_DB_READONLY_PASSWORD in .env}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --host 127.0.0.1 --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/database/postgresql_init.sh:/docker-entrypoint-initdb.d/10-app.sh:ro

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    image: app-backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      DJANGO_DB_ENGINE: django.db.backends.postgresql
      DJANGO_DB_NAME: ${DJANGO_DB_NAME:-app}
      DJANGO_DB_USER: ${DJANGO_DB_USER:-app_write}
      DJANGO_DB_PASSWORD: ${DJANGO_DB_PASSWORD:?Set DJANGO_DB_PASSWORD in .env}
      DJANGO_DB_HOST: database
      DJANGO_DB_PORT: "5432"
      DJANGO_DB_READONLY_USER: ${DJANGO_DB_READONLY_USER:-app_readonly}
      DJANGO_DB_READONLY_PASSWORD: ${DJANGO_DB_READONLY_PASSWORD:?Set DJANGO_DB_READONLY_PASSWORD in .env}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres-data:
