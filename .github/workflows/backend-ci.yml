name: Backend CI

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/actions/setup-backend/**"
      - ".github/workflows/backend-ci.yml"
      - "scripts/ci/backend/**"
      - "scripts/database/**"

  push:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/actions/setup-backend/**"
      - ".github/workflows/backend-ci.yml"
      - "scripts/ci/backend/**"
      - "scripts/database/**"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-backend

      - name: Ruff lint
        run: uv run --locked ruff check .

      - name: Ruff format
        run: uv run --locked ruff format --check .

  typecheck:
    name: Type checking
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-backend

      - name: Mypy
        run: uv run --locked mypy .

  architecture:
    name: Architecture checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-backend

      - name: Import Linter
        run: uv run --locked lint-imports

  tests:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash
        working-directory: backend

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-not-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-backend

      - name: Pytest
        run: uv run --locked pytest

  mutation-tests:
    name: Mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash
        working-directory: backend

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-not-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-backend

      - name: Mutmut
        run: ../scripts/ci/backend/mutation-test.sh

  postgresql-tests:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: app
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        shell: bash
        working-directory: backend

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-not-secret
      DJANGO_DB_ENGINE: django.db.backends.postgresql
      DJANGO_DB_NAME: app
      DJANGO_DB_USER: app_write
      DJANGO_DB_PASSWORD: app-write-password
      DJANGO_DB_HOST: 127.0.0.1
      DJANGO_DB_PORT: "5432"
      DJANGO_DB_READONLY_USER: app_readonly
      DJANGO_DB_READONLY_PASSWORD: app-readonly-password
      PGPASSWORD: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-backend

      - name: Create PostgreSQL test database and roles
        run: |
          psql --host 127.0.0.1 --username postgres --dbname app \
            --command "CREATE ROLE app_write LOGIN PASSWORD 'app-write-password' CREATEDB"
          psql --host 127.0.0.1 --username postgres --dbname app \
            --command "CREATE DATABASE test_app OWNER app_write"
          POSTGRES_USER=postgres \
          POSTGRES_DB=test_app \
          PGHOST=127.0.0.1 \
          DJANGO_DB_USER=app_write \
          DJANGO_DB_PASSWORD=app-write-password \
          DJANGO_DB_READONLY_USER=app_readonly \
          DJANGO_DB_READONLY_PASSWORD=app-readonly-password \
            ../scripts/database/postgresql_init.sh

      - name: Pytest
        run: uv run --locked pytest -o addopts= -m "not sqlite" --reuse-db

  migrations:
    name: Migration checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash
        working-directory: backend

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-not-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-backend

      - name: Django system check
        run: uv run --locked python manage.py check

      - name: Check missing migrations
        run: uv run --locked python manage.py makemigrations --check --dry-run
