name: Backend CI

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - ".github/actions/setup-backend/**"
      - ".github/workflows/backend-ci.yml"
      - "scripts/ci/backend/**"

  push:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - ".github/actions/setup-backend/**"
      - ".github/workflows/backend-ci.yml"
      - "scripts/ci/backend/**"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-backend

      - name: Ruff lint
        run: uv run --locked ruff check .

      - name: Ruff format
        run: uv run --locked ruff format --check .

  typecheck:
    name: Type checking
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-backend

      - name: Mypy
        run: uv run --locked mypy .

  architecture:
    name: Architecture checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-backend

      - name: Import Linter
        run: uv run --locked lint-imports

  migrations:
    name: Migration checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash
        working-directory: backend

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: ci-not-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-backend

      - name: Django system check
        run: uv run --locked python manage.py check

      - name: Check missing migrations
        run: uv run --locked python manage.py makemigrations --check --dry-run
