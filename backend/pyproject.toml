[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.6",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.17.1",
    "dotenv>=0.9.9",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.2.0",
]

[dependency-groups]
dev = [
    "djangorestframework-stubs>=3.16.0",
    "django-stubs[compatible-mypy]>=5.2.0",
    "import-linter>=2.6.0",
    "mypy>=1.15.0,<2.0.0",
    "pre-commit>=4.2.0",
    "pytest>=9.0.0",
    "pytest-django>=4.11.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = '-m "not postgresql"'
markers = [
    "postgresql: tests that verify PostgreSQL-specific database permissions",
    "sqlite: tests that verify SQLite-specific database permissions",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ", "RUF"]

[tool.ruff.lint.per-file-ignores]
"config/settings/__init__.py" = ["F401"]
"apps/custom_fields/models.py" = ["DJ001", "RUF012"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
files = ["apps", "config", "core"]
exclude = ["(^|/)migrations/"]
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
strict=true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.importlinter]
root_packages = ["apps", "config", "core"]

[[tool.importlinter.contracts]]
name = "Django apps are acyclic"
type = "acyclic_siblings"
ancestors = ["apps"]
depth = 0

[[tool.importlinter.contracts]]
name = "App implementation follows presentation-to-domain dependency flow"
type = "layers"
containers = [
    "apps.users",
]
layers = [
    "urls",
    "(views)",
    "(commands)",
    "(queries)",
    "(selectors)",
    "models",
]
